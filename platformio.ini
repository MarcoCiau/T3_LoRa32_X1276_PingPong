; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; LP_AUTH_REQUIRED is the deployment switch for proto::LabAuthOff.
; Lab envs leave it unset. Defining it deletes LabAuthOff's constructor.

[env:heltec_wifi_lora_32]
platform = espressif32
board = heltec_wifi_lora_32
framework = arduino
; Ping-pong bring-up only. Product sources live under src/node and src/gateway.
build_src_filter =
    +<main.cpp>
    +<ui.cpp>
lib_deps =
    jgromes/RadioLib @ 7.8.1
    U8g2@>=2.22.14

[env:node]
extends = env:heltec_wifi_lora_32
build_src_filter =
    +<node/>

[env:gateway]
extends = env:heltec_wifi_lora_32
build_src_filter =
    +<gateway/>

[env:native]
platform = native
test_framework = unity
; Host tests link the gateway registry, queue, and check-in coordinator. The ping-pong sketch stays out.
test_build_src = true
build_src_filter =
    +<gateway/node_registry.cpp>
    +<gateway/command_queue.cpp>
    +<gateway/radio_service.cpp>
build_flags = -std=c++17 -Isrc/gateway
